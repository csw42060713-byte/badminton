<!-- bm-v1.41.1 — 보안 장치(CSP). 다른 곳에서 들어온 스크립트·iframe·엉뚱한 주소를
     브라우저가 먼저 막습니다. 아래 두 해시는 이 파일의 인라인 스크립트(테마 부트스트랩·
     로딩 안전망)와 짝입니다. 인라인 스크립트를 고치면 해시도 함께 바꿔야 합니다
     (test/v141_1.test.js가 자동으로 확인합니다).
     bm-v1.50.0 — 영상 자세 비교(MediaPipe Pose) 때문에 아래 세 가지만 더 열었습니다.
       · script-src  https://cdn.jsdelivr.net (자세 모델 코드) · 'wasm-unsafe-eval'(WASM 실행)
       · connect-src 위 주소와 https://storage.googleapis.com (자세 모델 파일 6MB 다운로드)
       · media-src   'self' blob: (폰에서 고른 영상 파일을 blob: 주소로만 재생)
     'unsafe-eval'·'unsafe-inline'는 그대로 막혀 있습니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com 'sha256-INWe/ZxfH4F6qWiJqxsEThPW9Jdnza93ljULyO5kONE=' 'sha256-rBT/184oEeaTp5T04yQ08/fyWhcM0n8C3Vjm3Zjn3LQ=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://mwgpakntlollndfluwgg.supabase.co wss://mwgpakntlollndfluwgg.supabase.co https://accounts.google.com https://script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net https://storage.googleapis.com; frame-src https://accounts.google.com; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'">

<!-- 첫 페인트 전에 저장된 테마를 먼저 칠합니다.
     예전에는 <html>에 검정 배경이 박혀 있어 밝은 테마에서도 양옆·아래로 검정이 비쳤습니다. -->
<script>
(function () {
  var BG = { th_def: '#f6f8f6', th_night: '#080b0a', th_court: '#06170f', th_sakura: '#fff8fa' };
  var theme = 'th_def';
  try {
    var cache = JSON.parse(localStorage.getItem('bm_cache_v1') || 'null');
    var saved = cache && cache.me && cache.me.theme && cache.me.theme.theme;
    if (saved && BG[saved]) theme = saved;
  } catch (e) { /* 저장소를 못 읽어도 기본 코트로 칠합니다 */ }
  var de = document.documentElement;
  de.setAttribute('data-theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', BG[theme]);
})();
</script>

<!-- 앱 시작 로딩(스플래시) — 새 로고 타일 + 은은한 에메랄드 맥동.
     첫 화면이 준비되면 시작 코드가 .is-off를 붙여 340ms 동안 부드럽게 걷어냅니다
     (준비가 너무 빨리 끝나도 최소 420ms는 보이게 해 화면이 깜빡이지 않습니다). -->
<div id="splash" class="splash" role="status" aria-label="앱을 준비하고 있어요">
  <div class="splash__stack">
    <div class="splash__glow" aria-hidden="true"></div>
    <div class="splash__tile">
      <img class="splash__logo" src="icons/icon-512.png" alt="" width="512" height="512" decoding="async" fetchpriority="high">
    </div>
    <p class="splash__brand">SHUTTLIX</p>
    <p class="splash__t">셔틀릭스</p>
    <p class="splash__s">오늘의 코트를 준비하고 있어요</p>
    <span class="splash__bar" aria-hidden="true"><i></i></span>
  </div>
</div>
<!-- 안전망: 스크립트가 어떤 이유로든 첫 화면을 못 그리면 6초 뒤 로딩 화면이 스스로 걷힙니다.
     (앱이 정상으로 뜨면 시작 코드가 먼저 .is-off를 붙이므로 이 타이머는 아무 일도 하지 않습니다) -->
<script>
setTimeout(function () {
  var sp = document.getElementById('splash');
  if (sp) sp.classList.add('is-off');
}, 6000);
</script>
