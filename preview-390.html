<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>390×844 미리보기</title>
<style>html,body{margin:0;background:#dfe5e0}iframe{width:390px;height:844px;border:0;display:block;margin:0 auto;background:#fff}</style>
</head><body><iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.src = 'index.html#/' + (q.get('p') || 'log');
f.onload = function () {
  var y = Number(q.get('y') || 0);
  if (y) setTimeout(function () { f.contentWindow.scrollTo(0, y); }, 350);
};
</script>
</body></html>
