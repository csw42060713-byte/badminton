<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배드민턴 로직 테스트</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 18px 16px 40px; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; background: #0b100e; color: #eaf2ed; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #8b9a92; font-size: 12.5px; margin: 0 0 14px; }
  #summary { font-size: 15px; font-weight: 800; padding: 12px 14px; border-radius: 12px; background: #16201d; border: 1px solid rgba(255,255,255,.12); }
  #summary.ok { color: #3ed598; border-color: rgba(62,213,152,.4); }
  #summary.fail { color: #ff6b6b; border-color: rgba(255,107,107,.45); }
  ol { padding-left: 22px; font-size: 13px; line-height: 1.6; }
  li.ok { color: #9db3a8; }
  li.bad { color: #ff9b9b; font-weight: 700; }
  li.bad small { display: block; color: #d08b8b; font-weight: 400; }
</style>
</head>
<body>
<h1>배드민턴 로직 테스트</h1>
<p class="sub">test/logic.test.js · 브라우저에서 실제 앱 스크립트를 그대로 불러 실행합니다.</p>
<div id="summary">실행 중…</div>
<ol id="list"></ol>

<!-- 파일을 고치면 아래 ?v= 값을 올려 브라우저 캐시를 건너뜁니다. -->
<script src="../js/util.js?v=1.3.0"></script>
<script src="../js/domain.js?v=1.3.0"></script>
<script src="../js/ai.js?v=1.3.0"></script>
<script src="../js/seed.js?v=1.3.0"></script>
<script src="../js/api.js?v=1.3.0"></script>
<script src="../js/auth.js?v=1.3.0"></script>
<script src="../js/store.js?v=1.3.0"></script>
<script src="../js/ui.js?v=1.3.0"></script>
<script src="../js/views/profile.js?v=1.3.0"></script>
<script src="../js/views/chat.js?v=1.3.0"></script>
<script src="../js/views/log.js?v=1.3.0"></script>
<script src="../js/views/matching.js?v=1.3.0"></script>
<script src="../js/views/community.js?v=1.3.0"></script>
<script src="../js/views/coach.js?v=1.3.0"></script>
<script src="../js/views/my.js?v=1.3.0"></script>
<script src="../js/views/start.js?v=1.3.0"></script>
<script src="harness.js?v=1.3.0"></script>
<script src="fixtures.js?v=1.3.0"></script>
<script src="logic.test.js?v=1.3.0"></script>
<script src="usability.test.js?v=1.3.9"></script>
<script>
window.__done = false; window.__sum = null; window.__err = null;
BM.test.run().then(function (s) {
  window.__sum = { total: s.total, passed: s.passed, failed: s.failed,
    fails: s.results.filter(function (r) { return !r.ok; }) };
  window.__done = true;
  var sum = document.getElementById('summary');
  var list = document.getElementById('list');
  sum.className = s.failed ? 'fail' : 'ok';
  sum.textContent = (s.failed ? '✗ ' : '✓ ') + s.passed + '/' + s.total + ' 통과' +
    (s.failed ? ' · 실패 ' + s.failed : ' · 콘솔 오류 없이 전부 통과');
  list.innerHTML = s.results.map(function (r) {
    return '<li class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '✓ ' : '✗ ') + r.name +
      (r.error ? '<small>' + r.error + '</small>' : '') + '</li>';
  }).join('');
}).catch(function (e) {
  window.__err = String((e && e.message) || e);
  window.__done = true;
  var sum = document.getElementById('summary');
  sum.className = 'fail';
  sum.textContent = '테스트 실행 오류: ' + window.__err;
});
</script>
</body>
</html>
